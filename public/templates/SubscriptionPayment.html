<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:o="urn:schemas-microsoft-com:office:office">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="x-apple-disable-message-reformatting">
    <title>Email Template</title>
	<style>
		body{
			font-family: Poppins, sans-serif;
		}
	</style>
</head>
<body style="margin:0;padding:0;background-color:#f6f6f6;">
    <table role="presentation" width="100%" border="0" cellspacing="0" cellpadding="0" style="background:#f6f6f6;">
    	<tr>		
            <td align="center" style="padding:20px 0;">
                <!--[if (gte mso 9)|(IE)]>
                <table align="center" role="presentation" width="600">
                <tr>
                <td>
                <![endif]-->
                <table role="presentation" width="100%" style="max-width:600px;background:#ffffff;border:1px solid #e5e5e5;">
                    <!-- Header -->
                    <thead>
						<tr>
							<td style="text-align:center;display: block;"><img src="{{BASE_URL}}/assets/pathmaker-text-logo.png"/></td>
						</tr>
						<tr>
							<td style="padding: 40px 40px;background: #480082;color: #ffffff;text-align: left;border-radius: 20px;margin: 20px 40px;display: block;text-align:center;">
								<h2 style="margin:0;">{{PAYMENT_HEADER}}</h2>
							</td>
						</tr>
					</thead>
                    
                    <!-- Body Content -->
					<tbody>
						<tr>
							<td style="padding:50px;text-align:center;">
								<h2 style="color:#000;line-height:1.6;margin-top:0px;text-align: left;">Hello {{USERNAME}},</h2>
								<p style="color:#000;line-height:1.6;text-align: left;">{{TEMPLATE_HEADER}}</p>
                                <p style="color:#000;line-height:1.6;text-align: left;">{{TEMPLATE_FOOTER}}</p>
								<!-- CTA Button -->
								<!-- <table role="presentation" width="100%" style="margin:30px 0 0;">
									<tr>
										<td align="center">
											<a href="#" style="background:#480082;color:#ffffff;padding:12px 25px;text-decoration:none;border-radius:4px;display:inline-block;">Call to Action</a>
										</td>
									</tr>
								</table> -->
							</td>
						</tr>
					</tbody>                
					
                    <!-- Footer -->
					<tfoot>
						<tr>
							<td align="center">
								<table class="col-600" width="600" border="0" align="center" cellpadding="0" cellspacing="0">
									<tbody>						
										<tr>
											<td style="padding:20px;background:#f8f8f8;text-align:center;">
												<p style="margin:0;color:#999999;font-size:12px;">
													© 2025 The PathMaker, LLC<br>
												</p>
											</td>
										</tr>
									</tbody>
									<tfoot style="background: #FBB03B; padding: 5px; display: block;">
										<tr><td></td></tr>
									</tfoot>
								</table>
							</td>
						</tr>
					</tfoot>
                </table>
                <!--[if (gte mso 9)|(IE)]>
                </td>
                </tr>
                </table>
                <![endif]-->
            </td>
        </tr>
    </table>
</body>
</html>
